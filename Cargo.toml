[package]
name = "gray-background"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Image backgrounds for the gray TUI (sidecar plugin, wire v1)."

[[bin]]
name = "background"
path = "src/main.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
