[package]
name = "gray-background"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Image backgrounds for the gray TUI (sidecar plugin, wire v1)."

[[bin]]
name = "background"
path = "src/main.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
